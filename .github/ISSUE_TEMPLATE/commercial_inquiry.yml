name: 💼 Commercial Inquiry
description: Production deployment, licensing, or commercial runtime access
title: "[Commercial]: "
labels: ["commercial", "needs-review"]
body:
  - type: markdown
    attributes:
      value: |
        ## Commercial & Licensing Inquiries
        
        **PCS Developer Runtime** is a public evaluation runtime. Production deployment, commercial use, and enterprise features require separate licensing.
        
        This form routes to: **licensing@persistra.ai**
        
        **Response time:** 3-5 business days
        
        ---

  - type: input
    id: organization
    attributes:
      label: Organization
      description: Your company or organization name
      placeholder: Acme Corp
    validations:
      required: true

  - type: input
    id: contact
    attributes:
      label: Contact Email
      description: Best email to reach you
      placeholder: you@company.com
    validations:
      required: true

  - type: dropdown
    id: inquiry_type
    attributes:
      label: Inquiry Type
      description: What are you interested in?
      multiple: true
      options:
        - Production deployment rights
        - Commercial runtime access
        - Enterprise support
        - Internal organizational use
        - Conformance/certification
        - License structure questions
        - Other (specify below)
    validations:
      required: true

  - type: textarea
    id: use_case
    attributes:
      label: Use Case
      description: Brief description of your intended use
      placeholder: We're evaluating PCS for...
    validations:
      required: true

  - type: dropdown
    id: timeline
    attributes:
      label: Timeline
      description: When do you need this?
      options:
        - Immediate (< 1 month)
        - Near-term (1-3 months)
        - Mid-term (3-6 months)
        - Long-term (6+ months)
        - Exploratory
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Information
      description: Any other relevant details

  - type: markdown
    attributes:
      value: |
        ---
        
        **What happens next:**
        1. Your inquiry is routed to our licensing team
        2. We review and prioritize based on deployment readiness
        3. You'll receive a response within 3-5 business days
        4. If there's potential alignment, we'll schedule a discussion
        
        **Due to the volume and technical depth of inquiries, we review requests in batches and prioritize deployment-related conversations.**
